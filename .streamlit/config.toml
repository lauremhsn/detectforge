# No usage telemetry. Locally, bind to localhost with --server.address localhost (see README);
# that is not set here because Streamlit Community Cloud needs its own server settings.
[server]
headless = true

[browser]
gatherUsageStats = false

[client]
# No "Deploy" button or developer menu: this is a product, not a notebook.
toolbarMode = "minimal"

# "Forge": a warm, light look that reads well on a projector or LCD and isn't another blue dashboard.
# Warm stone background (no glare), charcoal ink, ember-orange accent (the forge), steel blue as the
# second colour, signal green for "caught". Fonts from Google Fonts, falling back to the system sans.
[theme]
base = "light"
primaryColor = "#C2551F"
backgroundColor = "#F3F0EB"
secondaryBackgroundColor = "#EAE5DD"
textColor = "#1F2328"
borderColor = "#D8D1C6"
linkColor = "#A8461A"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap, monospace"
headingFontWeights = [800, 700, 650, 600, 600, 600]
baseRadius = "0.7rem"
buttonRadius = "0.55rem"
showWidgetBorder = true
greenColor = "#2F7D4F"
orangeColor = "#B45309"
redColor = "#B42318"
blueColor = "#3D5A73"

[theme.sidebar]
backgroundColor = "#EAE5DD"
secondaryBackgroundColor = "#E0D9CE"
borderColor = "#D8D1C6"
