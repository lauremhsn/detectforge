# No usage telemetry. Locally, bind to localhost with --server.address localhost (see README);
# that is not set here because Streamlit Community Cloud needs its own server settings.
[server]
headless = true

[browser]
gatherUsageStats = false

[client]
# No "Deploy" button or developer menu: this is a product, not a notebook.
toolbarMode = "minimal"

# A calm "security console" look: dark navy, one blue accent, readable type.
# Fonts come from Google Fonts; without a connection the browser falls back to its sans-serif.
[theme]
base = "dark"
primaryColor = "#3B82F6"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#131D33"
textColor = "#E5ECF6"
borderColor = "#22304D"
linkColor = "#7DB3FF"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap, monospace"
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseRadius = "0.6rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
greenColor = "#22C55E"
orangeColor = "#F59E0B"
redColor = "#EF4444"
blueColor = "#3B82F6"

[theme.sidebar]
backgroundColor = "#0E1729"
secondaryBackgroundColor = "#16223A"
borderColor = "#1C2942"
