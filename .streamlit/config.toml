# No usage telemetry. Locally, bind to localhost with --server.address localhost (see README);
# that is not set here because Streamlit Community Cloud needs its own server settings.
[server]
headless = true

[browser]
gatherUsageStats = false

[client]
# No "Deploy" button or developer menu: this is a product, not a notebook.
toolbarMode = "minimal"

# A calm, light "security console" look that reads well on a projector or LCD: soft blue-grey
# background (not white, so no glare), off-white cards, deep navy text, steel-blue accent, teal second.
# Fonts come from Google Fonts; without a connection the browser falls back to its sans-serif.
[theme]
base = "light"
primaryColor = "#1F4FB8"
backgroundColor = "#E9EEF4"
secondaryBackgroundColor = "#DCE4EE"
textColor = "#13203A"
borderColor = "#C9D4E2"
linkColor = "#1F4FB8"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap, monospace"
headingFontWeights = [800, 700, 650, 600, 600, 600]
baseRadius = "0.7rem"
buttonRadius = "0.55rem"
showWidgetBorder = true
greenColor = "#15803D"
orangeColor = "#B45309"
redColor = "#B91C1C"
blueColor = "#1F4FB8"

[theme.sidebar]
backgroundColor = "#DCE4EE"
secondaryBackgroundColor = "#CFD9E6"
borderColor = "#C9D4E2"
