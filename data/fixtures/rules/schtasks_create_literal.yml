title: Scheduled Task Creation via Schtasks (fixture, literal)
id: 6c1c2b9e-3f4a-4d6e-9b1a-0f6a5e2d7c01
status: experimental
description: >
  Fixture rule written in the style of community rules. Matches the literal " /create "
  argument, so it misses several command-line transforms. For harness tests only.
author: DetectForge fixtures
date: 2026-10-23
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith: '\schtasks.exe'
    - OriginalFileName: 'schtasks.exe'
  selection_cli:
    CommandLine|contains: ' /create '
  condition: all of selection_*
falsepositives:
  - Software installers that register update tasks
level: medium
