title: Suspicious Command Execution via CMD Input Redirection
id: 7694529d-a0c7-5cdf-b169-6b2de541e06c
status: experimental
description: Detects cmd.exe executing commands from a file via input redirection using the /r switch, which is an uncommon pattern used to execute batch scripts indirectly.
author: DetectForge (agent-written, human-reviewed before deployment)
date: '2026-11-21'
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith: \cmd.exe
    - OriginalFileName: cmd.exe
  selection_cli:
    CommandLine|re: '(?i)(^|\s)[/-]r(\s|$)'
  selection_redir:
    CommandLine|contains: '<'
  selection_nested_cmd:
    CommandLine|re: '(?i)(^|\s)cmd(\s|<|$)'
  condition: all of selection_*
falsepositives:
  - Legitimate batch scripts that use cmd /r with input redirection (rare)
level: medium
tags:
  - attack.t1059.003
  - attack.execution