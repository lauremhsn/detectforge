title: Ingress Tool Transfer via MpCmdRun DownloadFile
id: f39efcea-b8c9-55a4-83e9-6c0b5a642618
status: experimental
description: Detects use of MpCmdRun.exe (Windows Defender command-line utility) with the -DownloadFile argument to download files from the internet, which can be abused for ingress tool transfer.
author: DetectForge (agent-written, human-reviewed before deployment)
date: '2026-11-21'
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith: \mpcmdrun.exe
  selection_original:
    OriginalFileName: mpcmdrun.exe
  selection_downloadfile:
    CommandLine|contains: '-DownloadFile'
  selection_url:
    CommandLine|contains:
      - '-url'
      - '/url'
  selection_path:
    CommandLine|contains:
      - '-path'
      - '/path'
  condition: (selection_image or selection_original) and selection_downloadfile and selection_url and selection_path
falsepositives:
  - Legitimate use of MpCmdRun for definition updates (rare with -DownloadFile)
level: high
tags:
  - attack.t1105
  - attack.ingress_tool_transfer