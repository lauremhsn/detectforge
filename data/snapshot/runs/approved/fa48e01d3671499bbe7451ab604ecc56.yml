title: Esentutl Used to Extract Browser Credentials
id: ebe81566-9b56-5bec-a2ff-5d24aa0321db
status: experimental
description: Detects use of esentutl.exe with /y and /d flags to copy browser credential databases (Login Data, Web Data, Cookies, etc.), which is indicative of credential theft from web browsers (T1555.003).
references:
  - https://attack.mitre.org/techniques/T1555/003/
author: DetectForge (agent-written, human-reviewed before deployment)
date: '2026-11-21'
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    - Image|endswith: '\esentutl.exe'
    - OriginalFileName: 'esentutl.exe'
  selection_flags:
    CommandLine|contains|windash:
      - 'y '
      - 'd '
  selection_browser_db:
    CommandLine|contains:
      - '\Login Data'
      - '\Web Data'
      - '\Cookies'
      - '\History'
      - '\Shortcuts'
      - '\Favicons'
      - '\Top Sites'
      - '\Network Action Predictor'
      - '\QuotaManager'
  condition: selection_image and selection_flags and selection_browser_db
falsepositives:
  - Legitimate database repair or backup operations targeting browser databases (rare)
level: high
tags:
  - attack.credential_access
  - attack.t1555.003