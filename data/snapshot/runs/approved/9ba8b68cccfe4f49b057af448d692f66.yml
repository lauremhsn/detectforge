title: WMI Command Line with XSL Format for Code Execution
id: 7fc5b2a0-312d-50d9-9299-50891064d449
status: experimental
description: "Detects wmic.exe using /FORMAT: or -FORMAT: with an XSL file, which can be used to execute arbitrary code via WMI (T1047)."
references:
  - https://attack.mitre.org/techniques/T1047/
author: DetectForge (agent-written, human-reviewed before deployment)
date: '2026-11-21'
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith: \wmic.exe
  selection_original:
    OriginalFileName: wmic.exe
  selection_format_xsl:
    CommandLine|re: '(?i)( |^)[/-]FORMAT:.*\.xsl'
  condition: (selection_image or selection_original) and selection_format_xsl
falsepositives:
  - Legitimate administrative use of wmic with XSL formatting (rare)
level: high
tags:
  - attack.t1047
  - attack.execution