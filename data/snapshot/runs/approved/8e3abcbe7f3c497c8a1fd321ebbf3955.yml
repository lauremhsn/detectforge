title: "Persistence via Registry Run Keys (T1547.001)"
id: "d4e1a3f2-8b4c-4f7a-9d2e-1c5b6a7e8f90"
status: test
description: Detects modification of Windows registry run keys (Run, RunOnce, RunOnceEx) via reg.exe to establish persistence.
author: "Detection Engineer"
date: "2024-01-15"
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith: '\reg.exe'
    - OriginalFileName: 'reg.exe'
  selection_runkey:
    CommandLine|contains:
      - 'CurrentVersion\Run'
  selection_add:
    CommandLine|re: '(?i)\badd\b'
  selection_v:
    CommandLine|re: '(?i)\Wv\b'
  selection_d:
    CommandLine|re: '(?i)\Wd\b'
  condition: selection_img and selection_runkey and (selection_add or (selection_v and selection_d))
falsepositives:
  - Legitimate software installation or configuration
  - System administrator activity
level: medium
tags:
  - attack.persistence
  - attack.t1547.001