title: Certutil Download with VerifyCTL - Potential Obfuscation
id: 49306151-98ed-54a7-951d-44d61d75b9ad
status: experimental
description: Detects certutil.exe being used with verifyctl and split flags to download content from a remote URL, which can be used to retrieve and decode obfuscated payloads.
references:
  - https://attack.mitre.org/techniques/T1027/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1027/T1027.md
author: DetectForge (agent-written, human-reviewed before deployment)
date: '2026-11-21'
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    - Image|endswith: \certutil.exe
    - OriginalFileName: CertUtil.exe
  selection_verifyctl:
    CommandLine|contains: verifyctl
  selection_split:
    CommandLine|contains: split
  selection_url:
    CommandLine|re: '(?i)https?://'
  condition: all of selection_*
falsepositives:
  - Legitimate certificate trust list updates from remote URLs (rare)
level: medium
tags:
  - attack.defense_evasion
  - attack.t1027