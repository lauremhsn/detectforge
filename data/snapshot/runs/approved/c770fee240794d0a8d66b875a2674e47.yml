title: LSASS Memory Dump via Rundll32 and Comsvcs.dll
id: 80df1434-5fb4-55c0-be9a-47990baf147d
status: experimental
description: Detects LSASS memory dump using rundll32.exe calling comsvcs.dll MiniDump function, a common credential dumping technique (T1003.001).
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: DetectForge (agent-written, human-reviewed before deployment)
date: '2026-11-22'
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    - Image|endswith: '\rundll32.exe'
    - OriginalFileName: 'rundll32.exe'
  selection_dll:
    CommandLine|contains: 'comsvcs.dll'
  selection_func:
    CommandLine|contains: 'MiniDump'
  condition: all of selection_*
falsepositives:
  - Legitimate debugging or memory analysis tools using comsvcs.dll (rare)
level: high
tags:
  - attack.credential_access
  - attack.t1003.001