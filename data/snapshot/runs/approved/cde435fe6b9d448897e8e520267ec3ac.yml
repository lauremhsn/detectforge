title: Windows Service Creation via sc.exe
id: d9faa7b7-ab3e-56d1-b403-a461df49ed73
status: experimental
description: Detects creation of new Windows services using sc.exe with automatic start, which can be used to establish persistence (T1543.003).
author: DetectForge (agent-written, human-reviewed before deployment)
date: '2026-11-22'
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith: \sc.exe
    - OriginalFileName: sc.exe
  selection_cli:
    CommandLine|contains|all:
      - 'create'
      - 'binPath='
      - 'start=auto'
  condition: all of selection_*
falsepositives:
  - Legitimate service installation by administrators or software installers
level: medium
tags:
  - attack.persistence
  - attack.t1543.003