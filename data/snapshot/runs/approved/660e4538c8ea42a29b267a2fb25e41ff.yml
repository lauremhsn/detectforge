title: Suspicious MSI Package Installation from Remote URL via msiexec
id: 28351107-dfa1-5c10-87ea-9a9b825f3818
status: experimental
description: Detects msiexec.exe installing an MSI package from a remote HTTP/HTTPS URL, which is a technique used to execute code via Windows Installer (T1218.007).
references:
  - https://attack.mitre.org/techniques/T1218/007/
author: DetectForge (agent-written, human-reviewed before deployment)
date: '2026-11-22'
logsource:
  category: process_creation
  product: windows
detection:
  selection_msiexec:
    - Image|endswith: \msiexec.exe
    - OriginalFileName: msiexec.exe
  selection_install_url:
    CommandLine|re: '(?i)[/-]i[\s"'''']+(https?://)'
  condition: selection_msiexec and selection_install_url
falsepositives:
  - Legitimate software installation from trusted internal repositories
  - Administrator installing approved software packages
level: medium
tags:
  - attack.defense_evasion
  - attack.t1218.007