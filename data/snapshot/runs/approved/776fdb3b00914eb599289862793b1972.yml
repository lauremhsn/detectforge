title: Windows Defender MpCmdRun DownloadFile Ingress Tool Transfer
id: 1921e3bf-5ae1-577c-b958-e0953c64d41c
status: experimental
description: Detects use of MpCmdRun.exe with -DownloadFile argument to download files from remote URLs, which can be abused for ingress tool transfer (T1105).
references:
  - https://attack.mitre.org/techniques/T1105/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1105/T1105.md
author: DetectForge (agent-written, human-reviewed before deployment)
date: '2026-11-21'
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith: '\MpCmdRun.exe'
  selection_original:
    OriginalFileName: 'MpCmdRun.exe'
  selection_download:
    CommandLine|contains|windash: 'DownloadFile'
  selection_url:
    CommandLine|contains|windash: 'url'
  selection_path:
    CommandLine|contains|windash: 'path'
  condition: (selection_image or selection_original) and selection_download and (selection_url or selection_path)
falsepositives:
  - Legitimate Windows Defender definition updates (typically run from Program Files/Windows Defender paths)
level: medium
tags:
  - attack.t1105
  - attack.ingress_tool_transfer