name: Audit

on:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"  # weekly, Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Export locked deps
        run: uv export --frozen --no-emit-project --all-groups --format requirements-txt -o requirements.txt
      - name: Audit
        # diskcache PYSEC-2026-2447: comes in via pysigma, no fixed release yet. Drop this once one ships.
        run: uvx pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-2447