version: 2

updates:
  # Python deps (reads uv.lock). One grouped PR a week so it's not noisy.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]

  # Keep the GitHub Actions we pin (checkout, setup-uv, codeql) current too.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]